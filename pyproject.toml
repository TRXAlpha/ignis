[project]
name = "ignis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18", "pint>=0.23", "pymupdf>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ignis_contract", "ingest", "ingest.curated", "model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
